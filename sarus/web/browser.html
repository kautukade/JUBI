<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Browser · Jubi</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="browser"><main class="page"><div class="hero"><div><h1>Headless Browser</h1><p>Read public web pages on the VPS with Playwright while blocking localhost, private and reserved networks.</p></div></div>
<div class="grid"><div class="card span-8"><div class="card-head"><div><div class="card-title">Browse public URL</div><div class="card-sub">Read-only navigation; no blind form submission or credential entry</div></div></div><div class="card-body stack"><input id="browser-url" class="input" value="https://example.com/" placeholder="https://example.com/"><label><input id="browser-shot" type="checkbox"> Save full-page screenshot to outputs/browser</label><div class="actions"><button id="browser-run" class="btn primary">Open page</button><button id="browser-status-refresh" class="btn">Refresh status</button></div><div id="browser-output" class="codebox">No page opened yet.</div></div></div>
<div class="card span-4"><div class="card-head"><div><div class="card-title">Runtime</div></div></div><div class="card-body"><div id="browser-status" class="codebox">Loading…</div></div></div></div></main><script src="/assets/app.js"></script></body></html>
