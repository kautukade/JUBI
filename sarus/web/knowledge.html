<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Knowledge · Jubi</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="knowledge"><main class="page"><div class="hero"><div><h1>Knowledge</h1><p>Manage the real local memory layer today, while keeping future semantic/vector memory separate from what is actually implemented.</p></div></div>
<div class="grid"><div class="card span-5"><div class="card-head"><div><div class="card-title">Save memory</div><div class="card-sub">Writes directly to Jubi's local persistent memory store</div></div></div><div class="card-body stack"><div class="field"><label>Title</label><input id="memory-title" class="input" placeholder="Memory title"></div><div class="field"><label>Namespace</label><input id="memory-ns" class="input" value="general"></div><div class="field"><label>Content</label><textarea id="memory-content" class="textarea" placeholder="Information Jubi should store locally"></textarea></div><button id="memory-save" class="btn primary">Save memory</button></div></div>
<div class="card span-7"><div class="card-head"><div><div class="card-title">Search local knowledge</div><div class="card-sub">Current Phase 0 memory is SQLite/FTS-backed, not fake semantic RAG</div></div></div><div class="card-body"><div class="toolbar"><input id="memory-q" class="input" placeholder="Search memory"><input id="memory-filter-ns" class="input" placeholder="Namespace (optional)"><button id="memory-search-btn" class="btn">Search</button></div><div id="memory-results" class="row-list" style="margin-top:12px"></div></div></div></div></main><script src="/assets/app.js"></script></body></html>
