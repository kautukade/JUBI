<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Automation · Jubi</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="automation"><main class="page"><div class="hero"><div><h1>Automation</h1><p>Create and control the recurring workflows already supported by Jubi’s local scheduler.</p></div></div>
<div class="grid"><div class="card span-5"><div class="card-head"><div><div class="card-title">Create recurring automation</div><div class="card-sub">Persists to the current WorkflowScheduler</div></div></div><div class="card-body stack"><div class="field"><label>Name</label><input id="automation-name" class="input" placeholder="Daily project check"></div><div class="field"><label>Interval (seconds)</label><input id="automation-interval" class="input" type="number" min="60" value="3600"></div><div class="field"><label>Task prompt</label><textarea id="automation-prompt" class="textarea" placeholder="Describe the task Jubi should execute on each interval"></textarea></div><button id="automation-create" class="btn primary">Create automation</button></div></div>
<div class="card span-7"><div class="card-head"><div><div class="card-title">Automation registry</div><div class="card-sub">Enable or pause persisted workflows</div></div><button id="automation-refresh" class="btn small">Refresh</button></div><div class="card-body"><div id="automation-list" class="row-list"></div></div></div></div></main><script src="/assets/app.js"></script></body></html>
