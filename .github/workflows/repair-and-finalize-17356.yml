name: Repair And Finalize Exact 17356

on:
  push:
    paths:
      - 'RUN_REPAIR_FINAL_17356'

permissions:
  contents: write

jobs:
  repair-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SARA physical count
        id: sara
        shell: bash
        run: |
          ROOT='sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK'
          COUNT=0
          if [ -d "$ROOT" ]; then COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' '); fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Current SARA count: $COUNT"

      - name: Securely materialize SARA if missing
        if: steps.sara.outputs.count != '213'
        shell: bash
        run: |
          set -euo pipefail
          URL='https://profile-prisoner-male-dental.trycloudflare.com/SARA-EXACT-213.tar.xz.enc'
          curl -L --fail --retry 8 --retry-all-errors --connect-timeout 20 "$URL" -o /tmp/SARA-EXACT-213.tar.xz.enc
          echo '7d7898e1f50d5c6445187274af382591af62e42eec87b9776430e0c5546c4a73  /tmp/SARA-EXACT-213.tar.xz.enc' | sha256sum -c -
          openssl enc -d -aes-256-cbc \
            -K '6436997bbb863406582ef59874d07b59bda302d80f90af6b0d1f172815788515' \
            -iv 'ea4aac7e554f7968769dd1ee26fef5fb' \
            -in /tmp/SARA-EXACT-213.tar.xz.enc \
            -out /tmp/SARA-EXACT-213.tar.xz
          echo '00f5cae1a2758c77622016555ebda596b3a928a2ffebaf68157fc15310a83a14  /tmp/SARA-EXACT-213.tar.xz' | sha256sum -c -
          xz -t /tmp/SARA-EXACT-213.tar.xz
          tar -xJf /tmp/SARA-EXACT-213.tar.xz

      - name: Hard verify every source project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, sys
          roots={
            'sara':('sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK',213),
            'hermes':('sources/hermes-agent-main(3)/hermes-agent-main',8541),
            'ecc':('sources/ECC-main(20260807-042951)/ECC-main',3438),
            'agency_agents':('sources/agency-agents-main(3)/agency-agents-main',343),
            'awesome_llm_apps':('sources/awesome-llm-apps-main(2)/awesome-llm-apps-main',1803),
            'second_brain':('sources/second-brain-skills-main(3)/second-brain-skills-main',97),
            'superpowers':('sources/superpowers-main(3)/superpowers-main',180),
            'fable_os':('sources/fable-os-main(3)/fable-os-main',1194),
            'cai':('sources/cai-main(3)/cai-main',1537),
            'autoresearch':('sources/autoresearch-master(3)/autoresearch-master',10),
          }
          counts={}
          for name,(root,expected) in roots.items():
            p=Path(root)
            n=sum(1 for x in p.rglob('*') if x.is_file()) if p.exists() else 0
            counts[name]=n
            print(f'{name}: {n}/{expected}')
            if n != expected: sys.exit(f'{name} mismatch: {n} != {expected}')
          total=sum(counts.values())
          if total != 17356: sys.exit(f'total mismatch: {total}')
          status={'expected_original_source_files':17356,'physical_source_files':17356,'missing_to_17356':0,'complete':True,'per_source':counts}
          Path('SOURCE_COUNT_STATUS.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          Path('COMPLETE_17356.ok').write_text('SARUS ORIGINAL SOURCE SNAPSHOT COMPLETE\nPHYSICAL_SOURCE_FILES=17356\nMISSING=0\nGITLINKS=0\n',encoding='utf-8')
          PY
          if git ls-files -s sources | awk '$1==160000 {bad=1} END{exit bad?0:1}'; then
            echo 'gitlink remains under sources' >&2
            exit 1
          fi

      - name: Write final status
        shell: bash
        run: |
          cat > UPLOAD_STATUS.md <<'EOF'
          # SARUS Source Upload Status

          **COMPLETE — 17,356 / 17,356 original source files are physically stored under `sources/`.**

          SARA 213; Hermes 8,541; ECC 3,438; Agency Agents 343; Awesome LLM Apps 1,803; Second Brain Skills 97; Superpowers 180; Fable OS 1,194; CAI 1,537; Autoresearch 10.

          Missing: **0**. Source gitlinks/submodules: **0**.
          EOF

      - name: Commit exact snapshot and status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/ SOURCE_COUNT_STATUS.json COMPLETE_17356.ok UPLOAD_STATUS.md
          git commit -m 'Repair and verify exact 17,356 physical source files' || true
          git push origin HEAD:main
