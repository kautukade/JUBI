name: Secure Materialize Exact SARA 213

on:
  push:
    paths:
      - 'SARA_SECURE_TRANSFER_READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current SARUS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download encrypted exact SARA archive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://profile-prisoner-male-dental.trycloudflare.com/SARA-EXACT-213.tar.xz.enc'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 "$URL" -o /tmp/SARA-EXACT-213.tar.xz.enc
          echo '7d7898e1f50d5c6445187274af382591af62e42eec87b9776430e0c5546c4a73  /tmp/SARA-EXACT-213.tar.xz.enc' | sha256sum -c -

      - name: Decrypt and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc \
            -K '6436997bbb863406582ef59874d07b59bda302d80f90af6b0d1f172815788515' \
            -iv 'ea4aac7e554f7968769dd1ee26fef5fb' \
            -in /tmp/SARA-EXACT-213.tar.xz.enc \
            -out /tmp/SARA-EXACT-213.tar.xz
          echo '00f5cae1a2758c77622016555ebda596b3a928a2ffebaf68157fc15310a83a14  /tmp/SARA-EXACT-213.tar.xz' | sha256sum -c -
          xz -t /tmp/SARA-EXACT-213.tar.xz

      - name: Extract exact 213 SARA source files
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/SARA-EXACT-213.tar.xz
          ROOT='sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK'
          SARA_COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "SARA physical files: $SARA_COUNT"
          test "$SARA_COUNT" -eq 213

      - name: Verify all ten physical source counts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, sys

          roots = {
              'sara': ('sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK', 213),
              'hermes': ('sources/hermes-agent-main(3)/hermes-agent-main', 8541),
              'ecc': ('sources/ECC-main(20260807-042951)/ECC-main', 3438),
              'agency_agents': ('sources/agency-agents-main(3)/agency-agents-main', 343),
              'awesome_llm_apps': ('sources/awesome-llm-apps-main(2)/awesome-llm-apps-main', 1803),
              'second_brain': ('sources/second-brain-skills-main(3)/second-brain-skills-main', 97),
              'superpowers': ('sources/superpowers-main(3)/superpowers-main', 180),
              'fable_os': ('sources/fable-os-main(3)/fable-os-main', 1194),
              'cai': ('sources/cai-main(3)/cai-main', 1537),
              'autoresearch': ('sources/autoresearch-master(3)/autoresearch-master', 10),
          }
          counts = {}
          ok = True
          for name, (root, expected) in roots.items():
              p = Path(root)
              count = sum(1 for x in p.rglob('*') if x.is_file()) if p.exists() else 0
              counts[name] = count
              print(f'{name}: {count}/{expected}')
              if count != expected:
                  ok = False
          total = sum(counts.values())
          status = {
              'expected_original_source_files': 17356,
              'physical_source_files': total,
              'missing_to_17356': 17356-total,
              'complete': ok and total == 17356,
              'per_source': counts,
          }
          Path('SOURCE_COUNT_STATUS.json').write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, indent=2))
          if not status['complete']:
              sys.exit('Exact 17,356 physical source file gate FAILED')
          PY

      - name: Ensure no source gitlinks remain
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -s sources | awk '$1==160000 {print; bad=1} END{exit bad?1:0}'; then
            echo 'No gitlinks remain under sources/'
          else
            echo 'Gitlink detected under sources/' >&2
            exit 1
          fi

      - name: Commit exact complete source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/ SOURCE_COUNT_STATUS.json
          git commit -m 'Materialize exact 17,356 physical source files' || true
          git push origin HEAD:main
