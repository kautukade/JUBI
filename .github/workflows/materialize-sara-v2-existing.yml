name: Materialize Existing SARA Safe V2

on:
  push:
    paths:
      - 'SARA_SAFE_V2_READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify existing bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root=Path('vendor/sara/sourcebundle-v2')
          parts=sorted(root.glob('part-*.b64'))
          print('parts', [p.name for p in parts])
          if len(parts)!=24:
              raise SystemExit(f'Expected 24 parts, got {len(parts)}')
          text=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(text, validate=True)
          expected=(root/'SHA256.txt').read_text().split()[0].lower()
          actual=hashlib.sha256(raw).hexdigest()
          print('expected',expected)
          print('actual  ',actual)
          if actual!=expected:
              raise SystemExit('SARA v2 checksum mismatch')
          Path('/tmp/SARA-public-safe-v2.tar.xz').write_bytes(raw)
          PY
          tar -tJf /tmp/SARA-public-safe-v2.tar.xz | head -20
          tar -xJf /tmp/SARA-public-safe-v2.tar.xz

      - name: Verify 210 extracted SARA files
        shell: bash
        run: |
          set -euo pipefail
          ROOT='sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK'
          COUNT=$(find "$ROOT" -type f | wc -l)
          echo "SARA physical files after extraction: $COUNT"
          test "$COUNT" -eq 210

      - name: Commit extracted safe SARA source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/
          git commit -m 'Materialize 210 verified SARA source files' || exit 0
          git push origin HEAD:main
