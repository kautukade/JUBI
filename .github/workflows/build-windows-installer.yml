name: Build Jubi Windows Installer

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'installer/**'
      - 'sarus/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'driver/**'
      - 'vendor/**'
      - 'sources/**'
      - 'docs/**'
      - 'BUILD_MANIFEST.json'
      - 'README.md'
      - '.github/workflows/build-windows-installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'sarus/**'
      - 'tests/**'
      - 'config/**'
      - 'driver/**'
      - 'vendor/**'
      - 'docs/**'
      - 'BUILD_MANIFEST.json'
      - 'README.md'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Jubi foundation
        uses: actions/checkout@v4

      - name: Verify production installer payload
        shell: powershell
        run: |
          $required = @(
            'BUILD_MANIFEST.json',
            'config\production.json',
            'sarus\server.py',
            'sarus\acceptance.py',
            'sarus\core\fable.py',
            'sarus\adapters\fable_os.py',
            'sarus\web\fable.html',
            'tests\fable_integration_test.py',
            'tests\production_readiness_test.py',
            'docs\FABLE-INTEGRATION.md',
            'docs\PRODUCTION-READINESS.md',
            'installer\INSTALL-SARUS.ps1',
            'installer\EXE-INSTALL.ps1',
            'installer\SETUP-BROKER.ps1',
            'installer\CERTIFY-SARUS.ps1',
            'installer\SIGN-RELEASE.ps1',
            'installer\UNINSTALL-SARUS.ps1',
            'installer\SARUS-Setup.iss',
            'vendor\launcher\SARUS.exe.b64',
            'vendor\launcher\SHA256.txt',
            'config\models.json',
            'config\broker_allowlist.json',
            'config\online_sources.json',
            'README.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing installer payload: $file" }
          }

          $powershellScripts = @(
            'installer\INSTALL-SARUS.ps1',
            'installer\EXE-INSTALL.ps1',
            'installer\SETUP-BROKER.ps1',
            'installer\CERTIFY-SARUS.ps1',
            'installer\SIGN-RELEASE.ps1',
            'installer\UNINSTALL-SARUS.ps1',
            'driver\SarusRing0\BUILD-RING0.ps1',
            'driver\SarusRing0\INSTALL-RING0.ps1'
          )
          foreach ($script in $powershellScripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell syntax error in $script : $messages"
            }
          }

          $iss = Get-Content -LiteralPath 'installer\SARUS-Setup.iss' -Raw
          if ($iss -match 'Filename:\s*"\{app\}\\START_SARUS\.bat"') {
            throw 'End-user installer shortcut still points to START_SARUS.bat; shortcuts must target Jubi.exe.'
          }
          if ($iss -notmatch 'Filename:\s*"\{app\}\\\{#MyAppExeName\}"') {
            throw 'Jubi.exe shortcut was not found in the Inno Setup definition.'
          }
          if ($iss -notmatch '#define MyAppName "Jubi"') {
            throw 'Installer product name is not Jubi.'
          }
          if ($iss -notmatch '#define MyAppVersion "0\.1\.0"') {
            throw 'Installer version is not Jubi 0.1.0.'
          }
          if ($iss -notmatch 'OutputBaseFilename=Jubi-Setup') {
            throw 'Installer output filename is not Jubi-Setup.'
          }

          $manifest = Get-Content -LiteralPath 'BUILD_MANIFEST.json' -Raw | ConvertFrom-Json
          $production = Get-Content -LiteralPath 'config\production.json' -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'Jubi' -or $production.name -ne 'Jubi') { throw 'Product metadata is not synchronized to Jubi.' }
          if ($manifest.version -ne '0.1.0' -or $production.version -ne '0.1.0') { throw 'Version metadata is not synchronized at 0.1.0.' }

          $onlineSources = Get-Content -LiteralPath 'config\online_sources.json' -Raw | ConvertFrom-Json
          $fable = $onlineSources | Where-Object { $_.key -eq 'fable_os' } | Select-Object -First 1
          if (-not $fable) { throw 'Pinned Fable source is missing from online_sources.json.' }
          if ($fable.repo -ne 'robiot/fable-os') { throw "Unexpected Fable repository: $($fable.repo)" }
          if ($fable.sha -ne '1cfe17c4baa77fac128008621721823913a1335c') { throw "Unexpected Fable pin: $($fable.sha)" }

          python -m compileall -q sarus scripts tests
          python tests\production_readiness_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Production readiness tests failed.' }
          python tests\fable_integration_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Fable integration tests failed.' }

      - name: Locate or install Inno Setup
        id: inno
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup (exit $LASTEXITCODE)." }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          Write-Host "Using Inno Setup compiler: $iscc"
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Jubi-Setup.exe
        shell: powershell
        run: |
          Remove-Item -LiteralPath 'dist-installer' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'dist-installer' | Out-Null
          & '${{ steps.inno.outputs.iscc }}' 'installer\SARUS-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify EXE artifact
        shell: powershell
        run: |
          $exe = 'dist-installer\Jubi-Setup.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Jubi-Setup.exe was not produced.' }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) { throw "Installer is unexpectedly small: $($item.Length) bytes" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          "SHA256  $hash  Jubi-Setup.exe" | Set-Content -LiteralPath 'dist-installer\SHA256.txt' -Encoding ascii
          Write-Host "Installer size: $([math]::Round($item.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Upload canonical Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Jubi-Windows-Installer
          path: |
            dist-installer/Jubi-Setup.exe
            dist-installer/SHA256.txt
            README.md
            docs/PRODUCTION-READINESS.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  cleanup-old-installers:
    name: Keep only current Jubi installer artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Delete older Jubi Windows installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_run = str(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          page = 1
          artifacts = []
          while True:
              data = request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}')
              batch = data.get('artifacts', [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          current = []
          old = []
          for artifact in artifacts:
              if artifact.get('name') != 'Jubi-Windows-Installer':
                  continue
              run_id = str((artifact.get('workflow_run') or {}).get('id', ''))
              if run_id == current_run:
                  current.append(artifact)
              else:
                  old.append(artifact)

          if len(current) != 1:
              raise SystemExit(f'Expected exactly one installer artifact for current run {current_run}, found {len(current)}')

          for artifact in old:
              artifact_id = artifact['id']
              request(f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}', method='DELETE')
              print(f'Deleted old installer artifact {artifact_id}')

          print(f'Canonical Jubi installer artifact kept: {current[0]["id"]}; deleted: {len(old)}')
          PY
