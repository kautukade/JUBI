name: Build SARUS Windows Installer

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'installer/**'
      - 'sarus/**'
      - 'scripts/**'
      - 'config/**'
      - 'driver/**'
      - 'vendor/**'
      - 'sources/**'
      - 'README.md'
      - '.github/workflows/build-windows-installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'sarus/**'
      - 'config/**'
      - 'driver/**'
      - 'vendor/**'
      - 'README.md'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout SARUS
        uses: actions/checkout@v4

      - name: Verify one-click installer payload
        shell: powershell
        run: |
          $required = @(
            'sarus\server.py',
            'installer\INSTALL-SARUS.ps1',
            'installer\EXE-INSTALL.ps1',
            'installer\SETUP-BROKER.ps1',
            'installer\UNINSTALL-SARUS.ps1',
            'installer\SARUS-Setup.iss',
            'vendor\launcher\SARUS.exe.b64',
            'vendor\launcher\SHA256.txt',
            'config\models.json',
            'config\broker_allowlist.json',
            'README.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing installer payload: $file" }
          }

          $powershellScripts = @(
            'installer\INSTALL-SARUS.ps1',
            'installer\EXE-INSTALL.ps1',
            'installer\SETUP-BROKER.ps1',
            'installer\UNINSTALL-SARUS.ps1',
            'driver\SarusRing0\INSTALL-RING0.ps1'
          )
          foreach ($script in $powershellScripts) {
            if (-not (Test-Path -LiteralPath $script)) { continue }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell syntax error in $script : $messages"
            }
          }

          $iss = Get-Content -LiteralPath 'installer\SARUS-Setup.iss' -Raw
          if ($iss -match 'Filename:\s*"\{app\}\\START_SARUS\.bat"') {
            throw 'End-user installer shortcut still points to START_SARUS.bat; shortcuts must target SARUS.exe.'
          }
          if ($iss -notmatch 'Filename:\s*"\{app\}\\\{#MyAppExeName\}"') {
            throw 'SARUS.exe shortcut was not found in the Inno Setup definition.'
          }

          python -m compileall -q sarus scripts tests

      - name: Locate or install Inno Setup
        id: inno
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup (exit $LASTEXITCODE)." }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          Write-Host "Using Inno Setup compiler: $iscc"
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build SARUS-Setup.exe
        shell: powershell
        run: |
          Remove-Item -LiteralPath 'dist-installer' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'dist-installer' | Out-Null
          & '${{ steps.inno.outputs.iscc }}' 'installer\SARUS-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify EXE artifact
        shell: powershell
        run: |
          $exe = 'dist-installer\SARUS-Setup.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'SARUS-Setup.exe was not produced.' }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) { throw "Installer is unexpectedly small: $($item.Length) bytes" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          "SHA256  $hash  SARUS-Setup.exe" | Set-Content -LiteralPath 'dist-installer\SHA256.txt' -Encoding ascii
          Write-Host "Installer size: $([math]::Round($item.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SARUS-Windows-Installer
          path: |
            dist-installer/SARUS-Setup.exe
            dist-installer/SHA256.txt
            README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
