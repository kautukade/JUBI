name: Materialize SARA Source

on:
  push:
    paths:
      - 'vendor/sara/private-full/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify private SARA source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root = Path('vendor/sara/private-full')
          parts = sorted(root.glob('part-*.b64'))
          if len(parts) != 38:
              raise SystemExit(f'Expected 38 parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          expected = (root / 'SHA256.txt').read_text().split()[0].lower()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch: expected {expected}, got {actual}')
          Path('/tmp/SARA-private-full.tar.xz').write_bytes(data)
          print(f'Verified private SARA archive: {actual}')
          PY
          tar -xJf /tmp/SARA-private-full.tar.xz

      - name: Remove transfer bundles
        run: |
          rm -rf vendor/sara/private-full
          rm -rf vendor/sara/sourcebundle-v2 vendor/sara/sourcebundle-v3 vendor/sara/sourcebundle-v4
          rm -rf vendor/sara/finalparts vendor/sara/xzparts vendor/sara/xz2parts vendor/sara/parts

      - name: Commit complete SARA source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize complete private SARA source (213 files)'
          git push origin HEAD:main
