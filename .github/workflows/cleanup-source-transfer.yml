name: Cleanup One-Time Source Transfer

on:
  push:
    paths:
      - 'CLEANUP_SOURCE_TRANSFER_READY'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require completed exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('SOURCE_COUNT_STATUS.json').read_text())
          assert d.get('complete') is True, d
          assert d.get('physical_source_files') == 17356, d
          assert d.get('missing_to_17356') == 0, d
          assert Path('COMPLETE_17356.ok').exists()
          PY

      - name: Remove one-time transfer workflow and trigger files
        shell: bash
        run: |
          rm -f \
            SARA_SAFE_V2_READY \
            SARA_SECURE_TRANSFER_READY \
            RUN_LIVE_SOURCE_REPORT \
            RUN_FINAL_17356_GATE \
            FINALIZE_EXACT_17356 \
            RUN_REPAIR_FINAL_17356 \
            CLEANUP_SOURCE_TRANSFER_READY || true
          rm -f \
            .github/workflows/materialize-sara-secure-transfer.yml \
            .github/workflows/materialize-sara-v2-existing.yml \
            .github/workflows/report-live-source-count.yml \
            .github/workflows/final-17356-gate.yml \
            .github/workflows/finalize-exact-source-snapshot.yml \
            .github/workflows/repair-and-finalize-17356.yml \
            .github/workflows/cleanup-source-transfer.yml || true

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean one-time source transfer controls' || true
          git push origin HEAD:main
