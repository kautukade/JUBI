name: Privileged Broker Security

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'sarus/**'
      - 'driver/**'
      - 'scripts/create_broker_approval.py'
      - 'installer/SETUP-BROKER.ps1'
      - 'installer/CERTIFY-SARUS.ps1'
      - 'installer/SIGN-RELEASE.ps1'
      - 'INSTALL-SARUS*.bat'
      - 'config/broker_allowlist.json'
      - 'config/policy.json'
      - 'tests/broker_security_test.py'
      - 'tests/ring0_bridge_test.py'
      - 'tests/production_readiness_test.py'
      - '.github/workflows/privileged-broker-security.yml'
  pull_request:
    paths:
      - 'sarus/**'
      - 'driver/**'
      - 'scripts/create_broker_approval.py'
      - 'installer/SETUP-BROKER.ps1'
      - 'installer/CERTIFY-SARUS.ps1'
      - 'installer/SIGN-RELEASE.ps1'
      - 'INSTALL-SARUS*.bat'
      - 'config/broker_allowlist.json'
      - 'config/policy.json'
      - 'tests/broker_security_test.py'
      - 'tests/ring0_bridge_test.py'
      - 'tests/production_readiness_test.py'
      - '.github/workflows/privileged-broker-security.yml'

permissions:
  contents: read

jobs:
  linux-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile SARUS Python
        run: python -m compileall -q sarus tests scripts/create_broker_approval.py
      - name: Validate policy JSON
        run: |
          python -m json.tool config/broker_allowlist.json > /dev/null
          python -m json.tool config/policy.json > /dev/null
          python -m json.tool config/production.json > /dev/null
      - name: Run production static gates
        run: python tests/production_readiness_test.py
      - name: Run isolated privileged broker security tests
        env:
          SARUS_BROKER_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          SARUS_RECEIPT_SIGNING_KEY_FILE: ${{ runner.temp }}/sarus-security-receipt.key
        run: python tests/broker_security_test.py
      - name: Run Ring0 bridge policy tests
        env:
          SARUS_BROKER_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          SARUS_RECEIPT_SIGNING_KEY_FILE: ${{ runner.temp }}/sarus-ring0-receipt.key
        run: python tests/ring0_bridge_test.py

  windows-broker-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provision protected broker storage
        shell: powershell
        run: |
          .\installer\SETUP-BROKER.ps1
          $secret = Join-Path $env:LOCALAPPDATA 'SARUS\broker\approval.secret'
          $receipt = Join-Path $env:LOCALAPPDATA 'SARUS\broker\receipt-signing.key'
          if (-not (Test-Path -LiteralPath $secret)) { throw 'Broker approval key was not provisioned.' }
          "SARUS_BROKER_SECRET_FILE=$secret" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SARUS_RECEIPT_SIGNING_KEY_FILE=$receipt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile SARUS and broker helper
        run: python -m compileall -q sarus tests scripts/create_broker_approval.py
      - name: Validate policy JSON
        shell: powershell
        run: |
          python -m json.tool config\broker_allowlist.json > $null
          python -m json.tool config\policy.json > $null
          python -m json.tool config\production.json > $null
      - name: Run production static gates
        run: python tests/production_readiness_test.py
      - name: Run broker tests with LocalAppData key storage
        run: python tests/broker_security_test.py
      - name: Run Ring0 bridge Windows smoke
        run: python tests/ring0_bridge_test.py
