name: Report Live Source Count

on:
  push:
    paths:
      - 'RUN_LIVE_SOURCE_REPORT'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count and report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          from pathlib import Path
          import json
          roots = {
            'sara': ('sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK', 213),
            'hermes': ('sources/hermes-agent-main(3)/hermes-agent-main', 8541),
            'ecc': ('sources/ECC-main(20260807-042951)/ECC-main', 3438),
            'agency_agents': ('sources/agency-agents-main(3)/agency-agents-main', 343),
            'awesome_llm_apps': ('sources/awesome-llm-apps-main(2)/awesome-llm-apps-main', 1803),
            'second_brain': ('sources/second-brain-skills-main(3)/second-brain-skills-main', 97),
            'superpowers': ('sources/superpowers-main(3)/superpowers-main', 180),
            'fable_os': ('sources/fable-os-main(3)/fable-os-main', 1194),
            'cai': ('sources/cai-main(3)/cai-main', 1537),
            'autoresearch': ('sources/autoresearch-master(3)/autoresearch-master', 10),
          }
          counts={k:sum(1 for x in Path(root).rglob('*') if x.is_file()) if Path(root).exists() else 0 for k,(root,_) in roots.items()}
          total=sum(counts.values())
          expected=sum(v for _,v in roots.values())
          print(json.dumps({'physical_source_files':total,'expected':expected,'complete':total==expected and all(counts[k]==roots[k][1] for k in roots),'per_source':counts}))
          PY
          cat /tmp/status.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/status.json 'https://profile-prisoner-male-dental.trycloudflare.com/report'
