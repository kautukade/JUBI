name: Materialize Complete Private SARA Source

on:
  push:
    paths:
      - 'vendor/sara/sourcebundle-v5/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete SARA source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root = Path('vendor/sara/sourcebundle-v5')
          parts = sorted(root.glob('part-*.b64'))
          if len(parts) != 18:
              raise SystemExit(f'Expected 18 transfer parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          expected = (root / 'SHA256.txt').read_text().split()[0].lower()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch: expected {expected}, got {actual}')
          Path('/tmp/SARA-private-complete-v5.tar.xz').write_bytes(data)
          print(f'Verified complete SARA archive: {actual}')
          PY
          tar -xJf /tmp/SARA-private-complete-v5.tar.xz

      - name: Verify SARA file count
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find 'sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK' -type f | wc -l)
          echo "SARA files: $COUNT"
          test "$COUNT" -eq 213

      - name: Remove temporary transfer bundles
        shell: bash
        run: |
          rm -rf vendor/sara/sourcebundle-v5
          rm -rf vendor/sara/sourcebundle-v4 || true
          rm -rf vendor/sara/sourcebundle-v3 || true
          rm -rf vendor/sara/sourcebundle-v2 || true
          rm -rf vendor/sara/finalparts || true
          rm -rf vendor/sara/xz2parts || true
          rm -rf vendor/sara/xzparts || true
          rm -rf vendor/sara/parts || true

      - name: Commit complete SARA source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize complete private SARA source (213 files)' || exit 0
          git push origin HEAD:main
