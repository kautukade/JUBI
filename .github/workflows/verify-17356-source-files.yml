name: Verify 17356 Physical Source Files

on:
  push:
    paths:
      - 'sources/**'
      - 'VERIFY_17356_READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Count physical files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          roots = {
            'sara': Path('sources/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK(4)/SARA-AI-Assistant-Local-AI-OS-v7.1.1-ROBUST-ONE-CLICK'),
            'hermes': Path('sources/hermes-agent-main(3)/hermes-agent-main'),
            'ecc': Path('sources/ECC-main(20260807-042951)/ECC-main'),
            'agency_agents': Path('sources/agency-agents-main(3)/agency-agents-main'),
            'awesome_llm_apps': Path('sources/awesome-llm-apps-main(2)/awesome-llm-apps-main'),
            'second_brain': Path('sources/second-brain-skills-main(3)/second-brain-skills-main'),
            'superpowers': Path('sources/superpowers-main(3)/superpowers-main'),
            'fable_os': Path('sources/fable-os-main(3)/fable-os-main'),
            'cai': Path('sources/cai-main(3)/cai-main'),
            'autoresearch': Path('sources/autoresearch-master(3)/autoresearch-master'),
          }
          counts = {}
          total = 0
          for name, root in roots.items():
            n = sum(1 for p in root.rglob('*') if p.is_file()) if root.exists() else 0
            counts[name] = n
            total += n
          status = {
            'expected_original_source_files': 17356,
            'physical_source_files': total,
            'missing_to_17356': 17356-total,
            'complete': total == 17356,
            'per_source': counts,
          }
          Path('SOURCE_COUNT_STATUS.json').write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, indent=2))
          PY

      - name: Commit status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_COUNT_STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update physical source file count'
          git push origin HEAD:main
