name: Vendor All Public Source Snapshots

on:
  push:
    paths:
      - 'VENDOR_PUBLIC_SOURCES_READY'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SARUS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Materialize exact original ZIP snapshots as physical files
        shell: bash
        run: |
          set -euo pipefail

          tree_info() {
            local repo="$1"
            local commit="$2"
            git -C "$repo" ls-tree -r -z "$commit" | python -c '
          import sys,hashlib
          data=sys.stdin.buffer.read()
          rows=[]
          for rec in data.split(b"\0"):
              if not rec: continue
              meta,path=rec.split(b"\t",1)
              fields=meta.split()
              if fields[1] != b"blob":
                  continue
              sha=fields[2]
              rows.append((path,sha))
          h=hashlib.sha256()
          for path,sha in sorted(rows):
              h.update(path); h.update(b"\0"); h.update(sha); h.update(b"\n")
          print(str(len(rows))+" "+h.hexdigest())
          '
          }

          resolve_and_vendor() {
            local url="$1"
            local start_sha="$2"
            local expected_count="$3"
            local expected_fp="$4"
            local dest="$5"
            local tmp repo info count fp found cand
            tmp="$(mktemp -d)"
            repo="$tmp/repo"
            echo "Resolving exact snapshot for $url"
            git clone --quiet "$url" "$repo"
            git -C "$repo" fetch --quiet origin "$start_sha" || true

            found=""
            info="$(tree_info "$repo" "$start_sha")"
            count="${info%% *}"
            fp="${info##* }"
            if [ "$count" = "$expected_count" ] && [ "$fp" = "$expected_fp" ]; then
              found="$start_sha"
            else
              echo "Pinned commit differs from original ZIP blobs: count=$count fp=$fp; searching history..."
              while read -r cand; do
                info="$(tree_info "$repo" "$cand")"
                count="${info%% *}"
                [ "$count" = "$expected_count" ] || continue
                fp="${info##* }"
                if [ "$fp" = "$expected_fp" ]; then
                  found="$cand"
                  break
                fi
              done < <(git -C "$repo" rev-list --first-parent --max-count=2000 "$start_sha")
            fi

            if [ -z "$found" ]; then
              echo "ERROR: exact original ZIP blob snapshot not found for $url"
              exit 1
            fi
            echo "Exact original snapshot resolved: $found ($expected_count files, $expected_fp)"
            git -C "$repo" checkout --quiet "$found"
            rm -rf "$repo/.git"

            git rm -f --cached --ignore-unmatch "$dest" || true
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -a "$repo" "$dest"
            rm -rf "$tmp"
          }

          resolve_and_vendor 'https://github.com/NousResearch/hermes-agent.git' '1fe53bd1ab3bfce098a2161cad0622d436738476' '8541' '923ea1bcc6b106725191ab847ff6b3194d0f89f9164d6f624fa7011eed9bce94' 'sources/hermes-agent-main(3)/hermes-agent-main'
          resolve_and_vendor 'https://github.com/affaan-m/ECC.git' '9aac8585ab887d9c51252730240b25d9cca180da' '3438' 'dee5ddce6c48ed5121bda03e0aad6b07ec1f32741a78c6ddfb71cf0923b6cf26' 'sources/ECC-main(20260807-042951)/ECC-main'
          resolve_and_vendor 'https://github.com/msitarzewski/agency-agents.git' 'ebe9c99acb5c96f9468de368d8bead775387d1a7' '343' '352b58463085d32e00e9b46e29de516ee6d9a06faa08a291bb7d4d5911b83853' 'sources/agency-agents-main(3)/agency-agents-main'
          resolve_and_vendor 'https://github.com/Shubhamsaboo/awesome-llm-apps.git' '779e9f9bcf87fa8cd95870a438b70b84e47d3173' '1803' '6d8a511e3ec7db3f22224b4fdfd8a046cc96d29c6a78e6a42cd04d60bada09fa' 'sources/awesome-llm-apps-main(2)/awesome-llm-apps-main'
          resolve_and_vendor 'https://github.com/coleam00/second-brain-skills.git' '75e1e9cd60ef46bffbd294fdfe4d0320cee2f563' '97' 'ee1cdc4d6df24c60dd31bdf4cde3b6c3a61cd9e1115faa17e72107ff64cde87a' 'sources/second-brain-skills-main(3)/second-brain-skills-main'
          resolve_and_vendor 'https://github.com/obra/superpowers.git' '44c9b2d6e889982ac18c27d05a19fefe335194e1' '180' 'a26f02795d7c12e504bd274e96469a46029b5e59b5e83d4c3130a4f4bae26cc7' 'sources/superpowers-main(3)/superpowers-main'
          resolve_and_vendor 'https://github.com/robiot/fable-os.git' '1cfe17c4baa77fac128008621721823913a1335c' '1194' '048a32f68cb6f0d5caef3242888d864c6237a201a5745474c5b7708d12e89e59' 'sources/fable-os-main(3)/fable-os-main'
          resolve_and_vendor 'https://github.com/aliasrobotics/cai.git' '62871b6f5a4b8951b2f4dd94dbb301ac306b3a65' '1537' '24002c23cf572a4a7d7b99c83447cfef8e8b204d326cc9843aeb64f1d978bb75' 'sources/cai-main(3)/cai-main'
          resolve_and_vendor 'https://github.com/karpathy/autoresearch.git' '228791fb499afffb54b46200aca536f79142f117' '10' 'd51c6aa5a815ad5f63f5a93e9365bb3bbd9028fb02c9fcf1604161bc36870e6b' 'sources/autoresearch-master(3)/autoresearch-master'

          rm -f .gitmodules

          python - <<'PY'
          from pathlib import Path
          expected = {
            'hermes-agent-main(3)/hermes-agent-main': 8541,
            'ECC-main(20260807-042951)/ECC-main': 3438,
            'agency-agents-main(3)/agency-agents-main': 343,
            'awesome-llm-apps-main(2)/awesome-llm-apps-main': 1803,
            'second-brain-skills-main(3)/second-brain-skills-main': 97,
            'superpowers-main(3)/superpowers-main': 180,
            'fable-os-main(3)/fable-os-main': 1194,
            'cai-main(3)/cai-main': 1537,
            'autoresearch-master(3)/autoresearch-master': 10,
          }
          total=0
          for rel,nexp in expected.items():
              root=Path('sources')/rel
              n=sum(1 for p in root.rglob('*') if p.is_file())
              print(f'{n:6d} {rel}')
              if n != nexp:
                  raise SystemExit(f'{rel}: expected {nexp}, got {n}')
              total += n
          if total != 17143:
              raise SystemExit(f'Expected 17143 public files, got {total}')
          print('VERIFIED_PUBLIC_FILES=', total)
          PY

      - name: Commit physical source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Vendor exact nine original source snapshots as physical files'
          git push origin HEAD:main
