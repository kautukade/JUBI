name: Production Readiness

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'sarus/**'
      - 'config/**'
      - 'installer/**'
      - 'driver/**'
      - 'tests/**'
      - 'BUILD_MANIFEST.json'
      - 'docs/PRODUCTION-READINESS.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'sarus/**'
      - 'config/**'
      - 'installer/**'
      - 'driver/**'
      - 'tests/**'
      - 'BUILD_MANIFEST.json'
      - 'docs/PRODUCTION-READINESS.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q sarus tests scripts
      - name: Production readiness tests
        run: python tests/production_readiness_test.py
      - name: Fable integration tests
        env:
          SARUS_RECEIPT_SIGNING_KEY_FILE: ${{ runner.temp }}/sarus-fable-receipt.key
        run: python tests/fable_integration_test.py
      - name: SARUS integration regression
        env:
          SARUS_BROKER_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          SARUS_RECEIPT_SIGNING_KEY_FILE: ${{ runner.temp }}/sarus-regression-receipt.key
        run: python tests/integration_test.py
      - name: Broker security tests
        env:
          SARUS_BROKER_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          SARUS_RECEIPT_SIGNING_KEY_FILE: ${{ runner.temp }}/sarus-security-receipt.key
        run: |
          python tests/broker_security_test.py
          python tests/ring0_bridge_test.py

  windows-production-gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $scripts = @(
            'installer\INSTALL-SARUS.ps1',
            'installer\EXE-INSTALL.ps1',
            'installer\SETUP-BROKER.ps1',
            'installer\CERTIFY-SARUS.ps1',
            'installer\SIGN-RELEASE.ps1',
            'installer\UNINSTALL-SARUS.ps1',
            'driver\SarusRing0\BUILD-RING0.ps1',
            'driver\SarusRing0\INSTALL-RING0.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "$script syntax errors: $(($errors | ForEach-Object Message) -join '; ')"
            }
          }
      - name: Compile Python
        run: python -m compileall -q sarus tests scripts
      - name: Production readiness tests
        run: python tests/production_readiness_test.py
      - name: Fable Windows tests
        env:
          SARUS_RECEIPT_SIGNING_KEY_FILE: ${{ runner.temp }}\sarus-fable-receipt.key
        run: python tests/fable_integration_test.py
      - name: Provision broker test keys
        shell: powershell
        run: |
          .\installer\SETUP-BROKER.ps1
          $secret = Join-Path $env:LOCALAPPDATA 'SARUS\broker\approval.secret'
          $receipt = Join-Path $env:LOCALAPPDATA 'SARUS\broker\receipt-signing.key'
          "SARUS_BROKER_SECRET_FILE=$secret" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SARUS_RECEIPT_SIGNING_KEY_FILE=$receipt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Broker and Ring0 Windows tests
        run: |
          python tests/broker_security_test.py
          python tests/ring0_bridge_test.py
