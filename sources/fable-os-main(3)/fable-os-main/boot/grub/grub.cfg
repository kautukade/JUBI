# grub.cfg — the menu GRUB shows when fable-os boots from real media.
#
# WHY THIS FILE EXISTS
#   `make run` uses QEMU's built-in -kernel loader, which reads the Multiboot
#   header in boot/boot.asm and jumps straight to 32-bit protected mode. That
#   is convenient and it is also a shortcut no physical machine offers. This
#   config is what turns kernel.bin into something a BIOS will actually start:
#   GRUB is placed in the El Torito boot catalogue of the ISO (and in the
#   protective MBR, so the same file can be written byte-for-byte to a USB
#   stick), GRUB loads /boot/kernel.bin as a Multiboot v1 image, and the kernel
#   cannot tell the difference between that and QEMU's loader — same magic in
#   EAX, same 32-bit entry, same everything.
#
#   `multiboot` (not `multiboot2`): boot/boot.asm carries a 0x1BADB002 header
#   with flags 0, and checks for 0x2BADB002 in EAX before it does anything.
#
# SERIAL
#   The kernel's console is VGA text mode plus COM1, and every headless test
#   reads COM1. Mirroring GRUB's own output onto the same port means a machine
#   that never reaches the kernel still tells you why. --append leaves the
#   normal console attached, so this is harmless on a box with no UART.

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input --append serial
terminal_output --append serial

set timeout=3
set default=0

menuentry "fable-os" {
    echo "Loading fable-os..."
    multiboot /boot/kernel.bin
    boot
}

# Same kernel, no timeout ambiguity — handy when demonstrating on hardware and
# you want to be certain nothing else was selected.
menuentry "fable-os (halt on failure, verbose)" {
    echo "Loading fable-os (verbose)..."
    set debug=linux,multiboot
    multiboot /boot/kernel.bin
    boot
}
